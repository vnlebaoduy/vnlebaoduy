        font-size="58" font-weight="700" letter-spacing="-0.5">Lê Bảo Duy</text>

  <rect x="516" y="130" width="168" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="166" text-anchor="middle" fill="#bfdbfe"
        font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="5.5">AI &amp; PLATFORM ENGINEER</text>

  <text x="600" y="196" text-anchor="middle" fill="#93c5fd" fill-opacity="0.78"
