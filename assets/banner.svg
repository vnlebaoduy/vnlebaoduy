<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Le Bao Duy - AI and Platform Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#dots)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>

  <path d="M0 150 Q 200 112 400 142 T 800 134 T 1200 160 L 1200 240 L 0 240 Z" fill="#0b1120" fill-opacity="0.34"/>
  <path d="M0 176 Q 240 142 480 172 T 960 164 T 1200 186 L 1200 240 L 0 240 Z" fill="#0b1120" fill-opacity="0.46"/>

  <text x="600" y="106" text-anchor="middle" fill="#ffffff"
